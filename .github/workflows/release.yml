name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to validate in dry-run mode, for example v1.12.0-rc.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.context.outputs.release_tag }}
      dry_run: ${{ steps.context.outputs.dry_run }}
      prerelease: ${{ steps.context.outputs.prerelease }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Resolve release context
        id: context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${EVENT_REF}" != "refs/heads/main" ]; then
              echo "Release dry-run must be dispatched from main; received ${EVENT_REF}." >&2
              exit 1
            fi
            release_tag="${INPUT_VERSION}"
            dry_run=true
          else
            release_tag="${EVENT_REF_NAME}"
            dry_run=false
          fi

          prerelease="$(bun - "${release_tag}" <<'BUN'
          import { parseReleaseTag } from './bin/release/validate-release.mjs';

          try {
            process.stdout.write(String(parseReleaseTag(process.argv[2]).prerelease));
          } catch (error) {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          }
          BUN
          )"

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "dry_run=${dry_run}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Fetch protected branch refs
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Validate release content and provenance
        env:
          RELEASE_TAG: ${{ steps.context.outputs.release_tag }}
          RELEASE_SHA: ${{ github.sha }}
          DRY_RUN: ${{ steps.context.outputs.dry_run }}
        run: |
          set -euo pipefail
          validation_args=(
            --tag "${RELEASE_TAG}"
            --sha "${RELEASE_SHA}"
            --main-ref origin/main
            --maintained-branch
            --repository-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          )
          if [ "${DRY_RUN}" = "true" ]; then
            validation_args+=(--dry-run)
          fi
          bun run --silent release:validate -- "${validation_args[@]}"

  build_release_assets:
    name: Build release assets
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      DRY_RUN: ${{ needs.preflight.outputs.dry_run }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
          cache-dependency-path: apps/manager-server/go.sum

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build maintained lightweight artifact
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            git tag --force "${RELEASE_TAG}" "${GITHUB_SHA}"
          else
            git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "${GITHUB_SHA}"
          fi
          git fetch --force https://github.com/seakee/CPA-Manager-Plus.git \
            "refs/tags/v1.12.6:refs/tags/v1.12.6"
          test "$(git rev-list -n 1 v1.12.6)" = "c428c212b8d4f2db5c3a8c288e9fe3cbb5f6c650"
          scripts/build-maintained-lightweight.sh

      - name: Check demo isolation
        run: bun run check:demo-isolation

      - name: Build native release packages
        run: bin/release/package-native.sh
        env:
          VERSION: ${{ needs.preflight.outputs.release_tag }}

      - name: Prepare release artifact
        run: |
          set -euo pipefail
          rm -rf dist/release
          mkdir -p dist/release/native
          cp output-maintained/management.html dist/release/management.html
          cp output-maintained/metadata.json dist/release/metadata.json
          cp output-maintained/SOURCE_COMMIT dist/release/SOURCE_COMMIT
          cp output-maintained/SHA256SUMS dist/release/SHA256SUMS
          cp dist/native/* dist/release/native/
          cp "docs/release-notes/${RELEASE_TAG}-zh.md" dist/release/release-notes.md
          (cd dist/release && sha256sum -c SHA256SUMS)
          (
            cd dist/release/native
            test "$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" -eq 6
            sha256sum -c checksums.txt
          )
          find dist/release -maxdepth 2 -type f -print | sort

      - name: Verify release artifact provenance
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          release_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          test "${release_commit}" = "${GITHUB_SHA}"
          test -s dist/release/management.html
          test -s dist/release/metadata.json
          test -s dist/release/SOURCE_COMMIT
          test -s dist/release/SHA256SUMS
          test -s dist/release/release-notes.md
          test -s dist/release/native/checksums.txt
          (cd dist/release && sha256sum -c SHA256SUMS)
          (
            cd dist/release/native
            test "$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" -eq 6
            sha256sum -c checksums.txt
          )
          test "$(tr -d '\r\n' < dist/release/SOURCE_COMMIT)" = "${release_commit}"
          python3 - "dist/release/metadata.json" "${release_commit}" "${RELEASE_TAG}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              metadata = json.load(handle)
          assert metadata["sourceHead"] == sys.argv[2]
          assert metadata["sourceTag"] == sys.argv[3]
          assert metadata["buildVersion"] == sys.argv[3]
          assert metadata["dirtyWorktreeAllowed"] is False
          PY

      - name: Reject an existing Release
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output existing-release.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          if [ "${status}" = "404" ]; then
            rm -f existing-release.json
            exit 0
          fi
          if [ "${status}" = "200" ]; then
            echo "Release ${RELEASE_TAG} already exists; refusing to rerun or overwrite assets." >&2
            exit 1
          fi
          cat existing-release.json >&2 || true
          echo "Unable to prove Release ${RELEASE_TAG} is absent (HTTP ${status})." >&2
          exit 1

      - name: Create Release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.preflight.outputs.release_tag }}
          files: |
            dist/release/management.html
            dist/release/metadata.json
            dist/release/SOURCE_COMMIT
            dist/release/SHA256SUMS
            dist/release/native/*
          body_path: dist/release/release-notes.md
          draft: false
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          overwrite_files: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify_telegram:
    name: Notify Telegram
    needs:
      - preflight
      - build_release_assets
    if: needs.preflight.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Send Telegram release notification
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          set -euo pipefail

          release_post="docs/release-posts/${RELEASE_TAG}-telegram.html"

          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured; Telegram notification skipped."
            echo "Telegram status: skipped-config" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [ ! -s "${release_post}" ]; then
            echo "::warning::Telegram release post ${release_post} was not found; notification skipped."
            echo "Telegram status: skipped-missing-post" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          reply_markup="$(python3 - "${release_url}" <<'PY'
          import json
          import sys

          print(json.dumps({
              "inline_keyboard": [[{"text": "查看 Release", "url": sys.argv[1]}]],
          }, ensure_ascii=False, separators=(",", ":")))
          PY
          )"

          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT
          curl_args=(
            --silent
            --show-error
            --retry 3
            --retry-all-errors
            --connect-timeout 10
            --max-time 30
            --output "${response_file}"
            --write-out "%{http_code}"
            --request POST
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"
            --data-urlencode "text@${release_post}"
            --data-urlencode "parse_mode=HTML"
            --data-urlencode "disable_web_page_preview=true"
            --data-urlencode "reply_markup=${reply_markup}"
          )

          if [ -n "${TELEGRAM_MESSAGE_THREAD_ID}" ]; then
            if ! [[ "${TELEGRAM_MESSAGE_THREAD_ID}" =~ ^[0-9]+$ ]]; then
              echo "::warning::TELEGRAM_MESSAGE_THREAD_ID must be numeric; Telegram notification skipped."
              echo "Telegram status: skipped-invalid-thread" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            curl_args+=(--data-urlencode "message_thread_id=${TELEGRAM_MESSAGE_THREAD_ID}")
          fi

          set +e
          http_code="$(curl "${curl_args[@]}")"
          curl_status=$?
          set -e

          if [ "${curl_status}" -ne 0 ] || ! [[ "${http_code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::warning::Telegram API delivery failed; GitHub Release remains successful."
            echo "Telegram status: failed-delivery" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if ! python3 - "${response_file}" <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              response = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError):
              raise SystemExit(1)

          raise SystemExit(0 if response.get("ok") is True else 1)
          PY
          then
            echo "::warning::Telegram API did not confirm message delivery; GitHub Release remains successful."
            echo "Telegram status: failed-delivery" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          echo "Telegram release notification sent successfully."
          echo "Telegram status: sent" >> "${GITHUB_STEP_SUMMARY}"
