name: Demo Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Demo Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2c39 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build demo site
        run: bun run build:demo
        env:
          VERSION: demo-${{ github.sha }}

      - name: Build docs site
        run: bun run docs:build

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          rm -rf dist/pages
          mkdir -p dist/pages/docs
          cp -R apps/web/dist-demo/. dist/pages/
          cp -R apps/docs/.vitepress/dist/. dist/pages/docs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages

  deploy:
    name: Deploy Demo Site
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
